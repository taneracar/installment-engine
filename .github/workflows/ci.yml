name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Property tests draw new random inputs on every run; a daily run keeps exploring.
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc
      - name: Tests (unit + property-based + UI)
        run: npx vitest run
      - name: Build demo
        run: npx vite build
